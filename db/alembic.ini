[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
# Bağlantı SMARTCHAIN_DB_URL ortam değişkeninden okunur (bkz. db/README.md)

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
