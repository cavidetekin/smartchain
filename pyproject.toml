[project]
name = "smartchain"
version = "0.18.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["db: yerel SQL Server'da test veritabanı (Smartchain_test, K-103); atlanırsa koşu başarısız olur, SQL Server olmadan -m 'not db'", "perf: performans hedefi (docs/08); büyük veriyi işlem içinde üretir ve geri alır; varsayılan koşuda çalışmaz, pytest -m perf"]
# Performans testleri makine yüküne duyarlıdır; varsayılan koşudan çıkarılır, ayrıca çalıştırılır (docs/08 "Testler").
addopts = "-m 'not perf'"
