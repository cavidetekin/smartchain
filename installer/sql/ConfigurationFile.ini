; Smartchain için ürüne ayrılmış SQL Server instance'ı: sessiz kurulum yanıt dosyası (K-75, docs/10-kurulum.md).
; Test sanal makinesinde ve müşteriye örnek olarak. SQL Server kurulum medyasının klasöründe, yönetici PowerShell'de:
;   .\setup.exe /ConfigurationFile=<bu dosya> /IACCEPTSQLSERVERLICENSETERMS /SQLSYSADMINACCOUNTS="$env:USERDOMAIN\$env:USERNAME"
; Yönetici hesabı komut satırında verilir; dosyada grup adı yoktur (Türkçe Windows'ta grup adları farklıdır).
[OPTIONS]
ACTION="Install"
FEATURES=SQLENGINE
INSTANCENAME="SMARTCHAIN"
INSTANCEID="SMARTCHAIN"
SQLCOLLATION="Latin1_General_100_CI_AS_SC"
SQLSVCSTARTUPTYPE="Automatic"
AGTSVCSTARTUPTYPE="Manual"
TCPENABLED="1"
NPENABLED="0"
QUIET="True"
QUIETSIMPLE="False"
INDICATEPROGRESS="True"
SUPPRESSPRIVACYSTATEMENTNOTICE="True"
; Kapalı ağ: kurulum güncelleme aramaz.
UPDATEENABLED="False"
USEMICROSOFTUPDATE="False"
